<svg
  [attr.viewBox]="viewBox"
  role="img"
  aria-label="Pigments on the OKLab a/b plane, with hue angles and a and b axes"
>
  <defs>
    <clipPath id="plot-circle">
      <circle [attr.cx]="size / 2" [attr.cy]="size / 2" [attr.r]="size / 2" />
    </clipPath>
    <linearGradient
      id="axis-a"
      gradientUnits="userSpaceOnUse"
      x1="0"
      y1="0"
      [attr.x2]="size"
      y2="0"
    >
      <stop offset="0" [attr.stop-color]="axisColors.aMinus" />
      <stop offset="0.5" stop-color="#9a9a9a" />
      <stop offset="1" [attr.stop-color]="axisColors.aPlus" />
    </linearGradient>
    <linearGradient
      id="axis-b"
      gradientUnits="userSpaceOnUse"
      x1="0"
      [attr.y1]="size"
      x2="0"
      y2="0"
    >
      <stop offset="0" [attr.stop-color]="axisColors.bMinus" />
      <stop offset="0.5" stop-color="#9a9a9a" />
      <stop offset="1" [attr.stop-color]="axisColors.bPlus" />
    </linearGradient>
  </defs>

  <g clip-path="url(#plot-circle)">
    @for (t of aTicks; track t.value) {
      <line class="grid faint" [attr.x1]="t.x" y1="0" [attr.x2]="t.x" [attr.y2]="size" />
    }
    @for (t of bTicks; track t.value) {
      <line class="grid faint" x1="0" [attr.y1]="t.y" [attr.x2]="size" [attr.y2]="t.y" />
    }
  </g>
  @for (ring of rings; track ring.c) {
    <circle class="grid" [attr.cx]="size / 2" [attr.cy]="size / 2" [attr.r]="ring.r" />
    <text class="grid-label" [attr.x]="size / 2 + 4" [attr.y]="size / 2 - ring.r + 12">
      C {{ ring.c }}
    </text>
  }
  @for (mark of hueMarks; track mark.deg) {
    <line
      class="grid"
      [attr.x1]="size / 2"
      [attr.y1]="size / 2"
      [attr.x2]="mark.x"
      [attr.y2]="mark.y"
    />
    <text class="hue-label" [attr.x]="mark.labelX" [attr.y]="mark.labelY">{{ mark.deg }}°</text>
  }
  <line
    class="axis"
    stroke="url(#axis-a)"
    x1="0"
    [attr.y1]="size / 2"
    [attr.x2]="size"
    [attr.y2]="size / 2"
  />
  <line
    class="axis"
    stroke="url(#axis-b)"
    [attr.x1]="size / 2"
    y1="0"
    [attr.x2]="size / 2"
    [attr.y2]="size"
  />

  <text class="axis-name" [attr.x]="size / 2 + 10" y="36">↑ yellow b+</text>
  <text class="axis-name" [attr.x]="size / 2 + 10" [attr.y]="size - 24">↓ blue b−</text>
  <text class="axis-name right" [attr.x]="size - 10" [attr.y]="size / 2 - 10">a+ magenta →</text>
  <text class="axis-name" x="10" [attr.y]="size / 2 - 10">← green a−</text>

  @if (state.showSrgb()) {
    <polygon class="srgb" [attr.points]="srgbPoints()" />
  }
  @if (state.showMixtureGamut() && mixturePoints()) {
    <polygon class="mixtures" [attr.points]="mixturePoints()" />
  }
  @for (m of markers(); track m.pigment.id) {
    <circle
      class="pigment"
      [class.fugitive]="m.pigment.fugitive"
      [attr.cx]="m.x"
      [attr.cy]="m.y"
      r="7"
      [attr.fill]="m.pigment.hex"
    />
  }
  @if (transition(); as t) {
    @for (points of t.linear; track $index) {
      <polyline class="curve-linear" [attr.points]="points" />
    }
    @for (end of t.ends; track end.pigment.id) {
      @if (end.truth; as truth) {
        <circle class="truth" [attr.cx]="truth.x" [attr.cy]="truth.y" r="11">
          <title>{{ end.pigment.name }}: true color, outside what the model reproduces</title>
        </circle>
      }
    }
    @for (dot of t.dots; track $index) {
      <circle class="dot" [attr.cx]="dot.x" [attr.cy]="dot.y" r="4.5" [attr.fill]="dot.hex">
        <title>{{ dot.tip }}</title>
      </circle>
    }
    @for (end of t.ends; track end.pigment.id) {
      <circle
        class="end"
        [attr.cx]="end.dot.x"
        [attr.cy]="end.dot.y"
        r="8"
        [attr.fill]="end.dot.hex"
        (click)="pick(end.pigment)"
      >
        <title>{{ label(end.pigment) }}</title>
      </circle>
    }
  }
  @if (solo(); as s) {
    <circle
      class="end"
      [attr.cx]="s.x"
      [attr.cy]="s.y"
      r="8"
      [attr.fill]="s.hex"
      (click)="pick(s.pigment)"
    >
      <title>{{ label(s.pigment) }}</title>
    </circle>
  }
  <!-- Click targets, drawn last so that path dots and end markers never block a click. -->
  @for (m of markers(); track m.pigment.id) {
    <circle class="hit" [attr.cx]="m.x" [attr.cy]="m.y" r="9" (click)="pick(m.pigment)">
      <title>{{ label(m.pigment) }}</title>
    </circle>
  }
</svg>
